<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch: type sets</title>
    <style>
      /* ================================================================================================================
                                                             Knobs
         ================================================================================================================ */

      @font-face {
        font-family: 'Mono';
        src: url('../../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2');
        font-weight: 100 800;
      }
      @font-face {
        font-family: 'Display';
        src: url('../../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2');
        font-weight: 200 800;
        font-stretch: 75% 100%;
      }

      :root {
        color-scheme: dark;

        /* The root: every rem in the page, so only the four sets' sizes follow it */
        font-size: 100%;

        /* The four sets, driven by the toolbar: their sizes in rem, written as px over 16; caps is the label's size */
        --set-heading-size: calc(15rem / 16);
        --set-heading-weight: 600;
        --set-body-size: calc(13rem / 16);
        --set-label-size: calc(11rem / 16);
        --set-caps-size: var(--set-label-size);
        --set-caps-tracking: 0.1em;

        /* The surfaces, from design-tokens.css */
        --controls-bg: light-dark(#f2f4f7, #1a1c20);
        --controls-text: light-dark(#1f2227, #e4e6ea);
        --controls-muted: light-dark(#556070, #8f949d);
        --controls-line: light-dark(#d9dfe8, #2c2f35);
        --button-bg: light-dark(#4f688e, #2a2d33);
        --button-text: light-dark(#f4f6fa, #eef0f3);
        --dash-bg: light-dark(#2c3e5c, #0d1014);
        --dash-text: light-dark(#eef2f8, #d9dee6);
        --dash-muted: light-dark(#a9b8cf, #7b8592);
        --dash-line: light-dark(#4a6185, #232a33);
        --menu-bg: light-dark(rgb(208 216 230), rgb(34 36 41));
        --menu-text: light-dark(#141a24, #e4e6ea);
        --menu-muted: light-dark(#333c4b, #8f949d);
        --menu-line: light-dark(#9aa6b8, #373a3c);
        --popup-pick: light-dark(#5f789e, #343840);
      }

      /* ================================================================================================================
                                                             Page
         ================================================================================================================ */

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 14px;
        background: light-dark(#e3e7ee, #111214);
        color: var(--controls-text);
        font-family: 'Mono', monospace;
        letter-spacing: 0.06em;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        align-items: center;
        margin-bottom: 14px;
        padding: 10px 12px;
        border: 1px dashed var(--controls-line);
        border-radius: 8px;
        background: var(--controls-bg);
        font-size: 12px;
        letter-spacing: 0;
      }

      .toolbar output {
        white-space: nowrap;
      }

      .toolbar label {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .toolbar output {
        min-width: 4.5ch;
        font-variant-numeric: tabular-nums;
      }

      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .column > h1 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 500;
        color: var(--controls-muted);
      }

      .surface {
        margin-bottom: 12px;
        padding: 14px;
        border-radius: 12px;
      }

      .controls {
        background: var(--controls-bg);
        font-weight: 500;
      }
      .dash {
        background: var(--dash-bg);
        color: var(--dash-text);
        font-weight: 400;
      }
      .menu {
        background: var(--menu-bg);
        color: var(--menu-text);
        font-weight: 500;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        justify-content: space-between;
        padding: 5px 0;
      }

      .muted {
        color: var(--muted);
      }
      .controls {
        --muted: var(--controls-muted);
        --line: var(--controls-line);
      }
      .dash {
        --muted: var(--dash-muted);
        --line: var(--dash-line);
      }
      .menu {
        --muted: var(--menu-muted);
        --line: var(--menu-line);
      }

      .tag {
        padding: 0 5px;
        border: 1px solid var(--line);
        border-radius: 4px;
      }

      .btn {
        padding: 4px 10px;
        border: 0;
        border-radius: 6px;
        background: var(--button-bg);
        color: var(--button-text);
        font: inherit;
        letter-spacing: inherit;
      }

      .small {
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
      }

      .tabs {
        display: flex;
        gap: 16px;
        margin-bottom: 10px;
      }
      .tabs span:not(:first-child) {
        color: var(--muted);
      }

      .figure {
        font-family: 'Display', sans-serif;
        font-stretch: 75%;
        font-weight: 700;
        font-size: 46px;
        line-height: 1;
        letter-spacing: 0.02em;
      }

      .entries {
        display: grid;
        grid-template-columns: 7ch 13.5ch 2ch 1fr auto;
        gap: 4px 8px;
        align-items: baseline;
      }

      .ticks {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        border-top: 1px solid var(--line);
        padding-top: 4px;
      }

      .popup {
        width: 220px;
        padding: 10px;
        border-radius: 12px;
        background: var(--button-bg);
        color: var(--button-text);
      }
      .popup .pick {
        border-radius: 6px;
        background: var(--popup-pick);
      }
      .popup .row {
        padding: 6px 8px;
      }

      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        text-align: center;
      }

      .space {
        margin-top: 12px;
      }

      /* ================================================================================================================
                                               Prototype: each part its own size
         ================================================================================================================ */

      .proto .m-heading {
        font-size: 16px;
        font-weight: 600;
      }
      .proto .m-tabs {
        font-size: 13px;
      }
      .proto .m-row {
        font-size: 14px;
      }
      .proto .m-small {
        font-size: 12px;
      }
      .proto .m-history {
        font-size: 11.5px;
      }
      .proto .m-tag {
        font-size: 11px;
      }
      .proto .m-caps {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .proto .cal-title {
        font-size: 13px;
      }
      .proto .cal-nav {
        font-size: 16px;
      }
      .proto .cal-wd {
        font-size: 10.5px;
      }
      .proto .cal-day {
        font-size: 12px;
      }
      .proto .c-pause {
        font-size: 12.5px;
        font-weight: 600;
      }
      .proto .c-field {
        font-size: 12px;
      }
      .proto .c-note {
        font-size: 10.5px;
      }
      .proto .p-caps {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .proto .p-row {
        font-size: 13px;
      }
      .proto .d-caps {
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .proto .d-entry {
        font-size: 12.5px;
      }
      .proto .d-tag {
        font-size: 11px;
      }
      .proto .d-month {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .proto .d-tick {
        font-size: 10px;
      }

      /* ================================================================================================================
                                                       Four sets
         ================================================================================================================ */

      .sets .heading {
        font-size: var(--set-heading-size);
        font-weight: var(--set-heading-weight);
      }
      .sets .body {
        font-size: var(--set-body-size);
      }
      .sets .label {
        font-size: var(--set-label-size);
      }
      .sets .caps {
        font-size: var(--set-caps-size);
        letter-spacing: var(--set-caps-tracking);
        text-transform: uppercase;
      }
      /* What belongs to its text, in em: it keeps its shape as the text grows */
      .sets .tag {
        padding: 0 0.45em;
      }
      .sets .small {
        padding: 0.15em 0.6em;
      }
      .sets .btn {
        padding: 0.3em 0.75em;
      }

      .sets .strong {
        font-weight: var(--set-heading-weight);
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <label>Root <input type="range" id="root" min="75" max="150" step="5" value="100" /><output></output></label>
      <label>Heading <input type="range" data-var="--set-heading-size" min="12" max="18" step="0.5" value="15" /><output></output></label>
      <label>weight <input type="range" data-var="--set-heading-weight" min="400" max="700" step="50" value="600" /><output></output></label>
      <label>Body <input type="range" data-var="--set-body-size" min="11" max="15" step="0.5" value="13" /><output></output></label>
      <label>Label <input type="range" data-var="--set-label-size" min="9" max="13" step="0.5" value="11" /><output></output></label>
      <label>tracking <input type="range" data-var="--set-caps-tracking" min="0" max="0.2" step="0.01" value="0.1" /><output></output></label>
      <label><input type="checkbox" id="light" /> Light</label>
    </div>

    <div class="columns">
      <!-- The same content twice: the prototype's own sizes, then the four sets -->
      <template id="content">
        <div class="surface menu">
          <div class="tabs"><span class="T-tabs">Profiler</span><span class="T-tabs">Tid</span></div>
          <div class="T-mcaps muted">Heltid</div>
          <div class="row"><span class="T-mrow">40h per vecka</span><button class="small T-msmall">Ändra</button></div>
          <div class="T-mhistory muted">Tidigare värden</div>
          <div class="T-mcaps muted space">Skatt och avgifter</div>
          <div class="row">
            <span class="T-mrow">Efter skatt</span><span class="tag T-mtag">25%</span>
          </div>
          <div class="row space">
            <span class="T-calnav">‹</span><span class="T-caltitle">november 2026</span><span class="T-calnav">›</span>
          </div>
          <div class="cal">
            <span class="T-calwd muted">mån</span><span class="T-calwd muted">tis</span><span class="T-calwd muted">ons</span><span class="T-calwd muted">tor</span><span class="T-calwd muted">fre</span><span class="T-calwd muted">lör</span><span class="T-calwd muted">sön</span>
            <span class="T-calday">23</span><span class="T-calday">24</span><span class="T-calday">25</span><span class="T-calday">26</span><span class="T-calday">27</span><span class="T-calday muted">28</span><span class="T-calday muted">29</span>
          </div>
        </div>

        <div class="surface controls">
          <div class="row"><button class="btn T-cpause">Lägg till paus</button><span class="T-cfield">1h 20min</span></div>
          <div class="T-cnote muted">Igång sedan 07:42 · Städ</div>
          <div class="T-cnote muted">Rensa poster äldre än ett år? Rensa · Inte nu</div>
          <div class="popup space">
            <div class="T-pcaps" style="padding: 4px 8px 6px; opacity: 0.7">Profil</div>
            <div class="row pick T-prow">Städ</div>
            <div class="row T-prow">Vaktmästeri</div>
          </div>
        </div>

        <div class="surface dash">
          <div class="T-dcaps muted">Saldo</div>
          <div class="figure">+3h 20min</div>
          <div class="T-dmonth muted space">November</div>
          <div class="entries T-dentry">
            <span>fre 27</span><span>07:42–16:10</span><span>S</span><span><span class="tag T-dtag">30m</span> <span class="tag T-dtag">e</span></span><span>8h 28min</span>
            <span>tor 26</span><span>07:30–15:55</span><span>V</span><span></span><span>8h 25min</span>
          </div>
          <div class="ticks muted T-dtick"><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span></div>
        </div>
      </template>

      <section class="column proto"><h1>Prototype</h1></section>
      <section class="column sets"><h1>Four sets</h1></section>
    </div>

    <script>
      // Each part's class in the prototype, and the set it wears in the four
      const parts = {
        tabs: ['m-tabs', 'body'],
        mcaps: ['m-caps', 'caps'],
        mrow: ['m-row', 'body'],
        msmall: ['m-small', 'body'],
        mhistory: ['m-history', 'label'],
        mtag: ['m-tag', 'label'],
        caltitle: ['cal-title', 'heading'],
        calnav: ['cal-nav', 'heading'],
        calwd: ['cal-wd', 'label'],
        calday: ['cal-day', 'body'],
        cpause: ['c-pause', 'body strong'],
        cfield: ['c-field', 'body'],
        cnote: ['c-note', 'label'],
        pcaps: ['p-caps', 'caps'],
        prow: ['p-row', 'body'],
        dcaps: ['d-caps', 'caps'],
        dentry: ['d-entry', 'body'],
        dtag: ['d-tag', 'label'],
        dmonth: ['d-month', 'caps'],
        dtick: ['d-tick', 'label'],
      }
      const content = document.getElementById('content')
      for (const [column, side] of [
        ['.proto', 0],
        ['.sets', 1],
      ]) {
        const copy = content.content.cloneNode(true)
        for (const [name, classes] of Object.entries(parts)) {
          for (const el of copy.querySelectorAll('.T-' + name)) el.classList.add(...classes[side].split(' '))
        }
        document.querySelector(column).append(copy)
      }
      // The menu's heading, above the tabs
      for (const [column, cls] of [
        ['.proto', 'm-heading'],
        ['.sets', 'heading'],
      ]) {
        const h = document.createElement('div')
        h.className = cls
        h.style.marginBottom = '8px'
        h.textContent = 'Inställningar'
        document.querySelector(column + ' .menu').prepend(h)
      }

      for (const input of document.querySelectorAll('[data-var]')) {
        const show = () => {
          const name = input.dataset.var
          const value = name.includes('size')
            ? `calc(${input.value}rem / 16)`
            : input.value + (name.includes('tracking') ? 'em' : '')
          document.documentElement.style.setProperty(name, value)
          input.nextElementSibling.textContent = name.includes('size') ? `${input.value}/16 rem` : value
        }
        input.addEventListener('input', show)
        show()
      }
      // The root, in % of the system's default; the sets' px at this root shown beside it
      const root = document.getElementById('root')
      const showRoot = () => {
        document.documentElement.style.fontSize = root.value + '%'
        root.nextElementSibling.textContent = `${root.value}% (${(16 * root.value) / 100}px)`
      }
      root.addEventListener('input', showRoot)
      showRoot()

      document.getElementById('light').addEventListener('change', (e) => {
        document.documentElement.style.colorScheme = e.target.checked ? 'light' : 'dark'
      })
    </script>
  </body>
</html>
